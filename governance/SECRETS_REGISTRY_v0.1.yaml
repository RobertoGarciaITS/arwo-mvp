registry:
  id: ARWO-SECRETS-REGISTRY
  version: "0.1"
  storage_target: Google Secret Manager

secrets:
  - id: SEC-001
    logical_name: ARWO_GOOGLE_OAUTH_CLIENT_SECRET
    purpose: Google Workspace OAuth client secret
    required_for:
      - Google Drive
      - Google Forms
      - Gmail
    repository_value_allowed: false
  - id: SEC-002
    logical_name: ARWO_GOOGLE_OAUTH_REFRESH_TOKEN
    purpose: Google Workspace OAuth refresh token
    required_for:
      - Google Drive
      - Google Forms
      - Gmail
    repository_value_allowed: false
  - id: SEC-003
    logical_name: ARWO_PUBLICATION_ACCESS_TOKEN
    purpose: Authorized external publication adapter access token
    required_for:
      - controlled external publication
    repository_value_allowed: false

rules:
  plaintext_secret_in_git: prohibited
  secret_value_in_logs: prohibited
  secret_value_in_test_fixture: prohibited
  secret_rotation_supported: required
  secret_reference_names_versioned_in_git: allowed
