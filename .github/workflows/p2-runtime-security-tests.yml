name: Phase 02 Runtime Security Tests

on:
  pull_request:
    paths:
      - "architecture/RUNTIME_CONFIGURATION_CONTRACT_v0.1.yaml"
      - "governance/SECRETS_REGISTRY_v0.1.yaml"
      - "governance/ENVIRONMENT_POLICY_v0.1.yaml"
      - "governance/IAM_RUNTIME_ROLE_MATRIX_v0.1.yaml"
      - "schemas/RUNTIME_CONFIG_SCHEMA_v0.1.json"
      - "config/runtime.env.example"
      - "tests/P2_RUNTIME_SECURITY_TESTS_v0.1.yaml"
      - "scripts/validate_runtime_security.py"
      - ".github/workflows/p2-runtime-security-tests.yml"
      - "requirements-dev.txt"
  push:
    branches: [main]
    paths:
      - "architecture/RUNTIME_CONFIGURATION_CONTRACT_v0.1.yaml"
      - "governance/SECRETS_REGISTRY_v0.1.yaml"
      - "governance/ENVIRONMENT_POLICY_v0.1.yaml"
      - "governance/IAM_RUNTIME_ROLE_MATRIX_v0.1.yaml"
      - "schemas/RUNTIME_CONFIG_SCHEMA_v0.1.json"
      - "config/runtime.env.example"
      - "scripts/validate_runtime_security.py"

jobs:
  validate-runtime-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Phase-02 runtime security gate
        run: python scripts/validate_runtime_security.py
