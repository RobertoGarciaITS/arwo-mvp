name: Controlled Publication Tests

on:
  pull_request:
    paths:
      - "integrations/publication/**"
      - "skills/controlled_publication/**"
      - "policies/CONTROLLED_PUBLICATION_POLICY_v0.1.yaml"
      - "schemas/PUBLICATION_EXECUTION_PLAN_SCHEMA_v0.1.json"
      - "tests/CONTROLLED_PUBLICATION_TESTS_v0.1.yaml"
      - "scripts/build_publication_execution_plan.py"
      - "scripts/validate_controlled_publication.py"
      - "scripts/build_approval_manifest.py"
      - ".github/workflows/controlled-publication-tests.yml"
      - "requirements-dev.txt"
  push:
    branches: [main]
    paths:
      - "integrations/publication/**"
      - "skills/controlled_publication/**"
      - "policies/CONTROLLED_PUBLICATION_POLICY_v0.1.yaml"
      - "schemas/PUBLICATION_EXECUTION_PLAN_SCHEMA_v0.1.json"
      - "tests/CONTROLLED_PUBLICATION_TESTS_v0.1.yaml"
      - "scripts/build_publication_execution_plan.py"
      - "scripts/validate_controlled_publication.py"

jobs:
  validate-controlled-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Controlled Publication gate
        run: python scripts/validate_controlled_publication.py
