name: Publication Generator Tests
# CHUNK-05 gate

on:
  pull_request:
    paths:
      - "agents/publication_generator/**"
      - "skills/publication_generation/**"
      - "prompts/PUBLICATION_GENERATOR_PROMPT_v0.1.md"
      - "policies/PUBLICATION_GENERATION_POLICY_v0.1.yaml"
      - "schemas/PUBLICATION_OUTPUT_SCHEMA_v0.1.json"
      - "tests/PUBLICATION_GENERATOR_TESTS_v0.1.yaml"
      - "tests/golden/GTC001_GAMING_QA_ENGINEER/EXPECTED_PUBLICATION_v0.1.yaml"
      - "scripts/validate_publication_generator.py"
      - ".github/workflows/publication-generator-tests.yml"
      - "requirements-dev.txt"
  push:
    branches:
      - main
    paths:
      - "agents/publication_generator/**"
      - "skills/publication_generation/**"
      - "prompts/PUBLICATION_GENERATOR_PROMPT_v0.1.md"
      - "policies/PUBLICATION_GENERATION_POLICY_v0.1.yaml"
      - "schemas/PUBLICATION_OUTPUT_SCHEMA_v0.1.json"
      - "tests/PUBLICATION_GENERATOR_TESTS_v0.1.yaml"
      - "tests/golden/GTC001_GAMING_QA_ENGINEER/EXPECTED_PUBLICATION_v0.1.yaml"
      - "scripts/validate_publication_generator.py"

jobs:
  validate-publication-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run deterministic Publication Generator gate
        run: python scripts/validate_publication_generator.py
